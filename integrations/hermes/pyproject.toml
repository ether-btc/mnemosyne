[project]
name = "mnemosyne-plugin"
version = "0.7.0"
description = "Mnemosyne memory provider for Hermes Agent - catalog plugin wrapper (local-first, zero-cloud memory)"
requires-python = ">=3.11"
dependencies = [
    "mnemosyne-hermes>=0.7.0,<0.8",
    "mnemosyne-memory[embeddings]>=3.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
