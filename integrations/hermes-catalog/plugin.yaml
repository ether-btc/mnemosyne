name: mnemosyne
kind: exclusive
version: 0.7.1
description: "Native local memory for Hermes - SQLite with vector search, FTS5 hybrid ranking, episodic consolidation, and temporal triples. Zero cloud. Installed from the Hermes plugin catalog; the implementation is the mnemosyne-hermes package declared in pyproject.toml."
author: Abdias J
# A floor, not a pin: Hermes refuses to load this plugin when the running version fails this
# specifier, so the value must name a release that was actually published. 0.21.3 is the
# release that installs declared plugin Python dependencies (hermes-agent 96e8a23222), which
# is the behaviour this wrapper relies on; raising it needs a newer *released* Hermes.
requires_hermes: ">=0.21.3"
provides_tools:
  - mnemosyne_apply_pending
  - mnemosyne_batch
  - mnemosyne_diagnose
  - mnemosyne_export
  - mnemosyne_forget
  - mnemosyne_forget_canonical
  - mnemosyne_get
  - mnemosyne_graph_link
  - mnemosyne_graph_query
  - mnemosyne_import
  - mnemosyne_invalidate
  - mnemosyne_model_card
  - mnemosyne_model_refresh
  - mnemosyne_persona_demote
  - mnemosyne_persona_list
  - mnemosyne_persona_promote
  - mnemosyne_persona_reinforce
  - mnemosyne_recall
  - mnemosyne_recall_canonical
  - mnemosyne_recall_diagnostics
  - mnemosyne_remember
  - mnemosyne_remember_canonical
  - mnemosyne_scratchpad_clear
  - mnemosyne_scratchpad_read
  - mnemosyne_scratchpad_write
  - mnemosyne_shared_forget
  - mnemosyne_shared_recall
  - mnemosyne_shared_remember
  - mnemosyne_shared_stats
  - mnemosyne_sleep
  - mnemosyne_stats
  - mnemosyne_sync_pull
  - mnemosyne_sync_push
  - mnemosyne_sync_status
  - mnemosyne_task_progress
  - mnemosyne_triple_add
  - mnemosyne_triple_end
  - mnemosyne_triple_query
  - mnemosyne_update
  - mnemosyne_validate
provides_hooks: []
provides_middleware: []
requires_env: []
